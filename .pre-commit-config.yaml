repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: check-json
      - id: check-yaml
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: mixed-line-ending

  - repo: local
    hooks:
      - id: prettier-check
        name: prettier check
        entry: npx prettier --check
        language: system
        types_or: [ javascript, jsx, ts, tsx, svelte, json, yaml, markdown, css, html ]

      - id: eslint
        name: eslint
        entry: npx eslint --max-warnings=0
        language: system
        files: \.(js|cjs|mjs|ts|svelte)$
