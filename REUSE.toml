version = 1

[[annotations]]
path = [
    "README.md",
    ".gitignore",
    ".dockerignore",
    ".pre-commit-config.yaml",
    ".gitlab-ci.yml",
    ".npmrc",
    ".prettierignore",
    ".prettierrc",
    ".vscode/*.json",
    "package-lock.json",
    "package.json",
    "tsconfig.json",
    "vite.config.ts",
    "src/app.html",
    "static/robots.txt",
    "test.http",
    "**/*.png",
    "**/*.svg",
    "**/*.mp4",
    "**/*.ttf",
    "**/*.otf"
]
precedence = "override"
